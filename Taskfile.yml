version: "3"

vars:
  MODULE:
    # GOWORK=off, because a go.work makes `go list -m` print every module in
    # the workspace and this wants one. With two, the gci prefix section below
    # is a two-line string that matches nothing, both modules land in one
    # group, and `task fmt` then writes what `task fmt:check` rejects — a local
    # gate disagreeing with CI, which is the failure P4 names.
    sh: GOWORK=off go list -m

tasks:
  deps:
    desc: Download and normalize Go dependencies
    # Every lane verify runs resolves modules with the workspace off, so a local
    # pass and a CI pass mean the same thing. go.work is gitignored — it is on
    # this machine and never on the runner — so with it in play the gate builds
    # ../minecraft-protocol's working tree while CI builds the tag in go.mod, and
    # a pin left a release behind passes here and ships. test:fast keeps the
    # workspace; it is the edit loop, which is what the workspace is for.
    sources:
      - go.mod
      - go.sum
    cmds:
      - env GOWORK=off go mod download
      - env GOWORK=off go mod tidy

  fmt:
    desc: Format Go source
    deps: [deps]
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/go-theft-craft)" -s "prefix({{.MODULE}})" .
      - gofumpt -w .

  fmt:check:
    desc: Check Go formatting without changing files
    deps: [deps]
    cmds:
      - |
        formatting_diff="$(golangci-lint fmt --diff)"
        if [ -n "$formatting_diff" ]; then
          printf '%s\n' "$formatting_diff"
          exit 1
        fi

  lint:
    desc: Run static analysis
    deps: [fmt:check]
    cmds:
      - golangci-lint run

  secrets:
    desc: Scan the repository tree for secrets and private keys
    cmds:
      - gitleaks dir --no-banner --redact --verbose .

  secrets:staged:
    desc: Scan staged changes for secrets and private keys
    cmds:
      - gitleaks git --no-banner --redact --verbose --staged

  precommit:
    desc: Run checks required before a commit
    cmds:
      - task: lint
      - task: secrets:staged

  test:
    desc: Run unit tests with the race detector
    deps: [deps]
    cmds:
      - env GOWORK=off go test -race -covermode=atomic -coverprofile=coverage.out ./...

  test:fast:
    desc: Run unit tests without the race detector, for the edit loop
    deps: [deps]
    # The same tests as test. The race detector's instrumented rebuild is what
    # separates them, and every source edit invalidates it — measured at 23
    # seconds against 2 on a sibling tree. Run this while editing and test
    # before committing; verify still runs the race lane, which is the only one
    # that finds the failure you cannot reproduce on purpose.
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  test:e2e:
    desc: Run the end-to-end client tests against the in-process fixture server
    deps: [deps]
    cmds:
      - env GOWORK=off go test -race -run 'TestEndToEnd' ./client/...

  test:vanilla:
    desc: Run the vanilla conformance lane; needs a prepared 1.8.9 server jar
    # The only check that survives being wrong in the fifteenth decimal place.
    # It starts a real server, so it is behind a build tag and out of verify: an
    # ordinary run stays fast and offline, and this runs when someone asks.
    #
    # It skips rather than fetches when the jar is absent. Run `task
    # server:vanilla` once to have mcreference prepare one.
    deps: [deps]
    cmds:
      - go test ./client/ -run TestVanilla -tags vanilla -timeout 20m -v {{.CLI_ARGS}}

  examples:
    desc: Lint and test the examples module
    # examples/ is its own module, so `go test ./...` from the root does not
    # descend into it. Without this task the examples rot silently, which is the
    # one thing an example used as an integration surface must not do.
    dir: examples
    cmds:
      - env GOWORK=off go mod tidy
      - env GOWORK=off golangci-lint run ./...
      - env GOWORK=off go test -race ./...
      - env GOWORK=off go vet ./...

  server:vanilla:
    desc: Run a pinned vanilla server for live checks, fetching the jar if absent
    # Examples are this repository's integration surface, and the only way to
    # know one works is to point it at the server the protocol was written
    # against. This task stands that server up the same way every time, so a
    # result is reproducible rather than a story about somebody's laptop.
    #
    # The jar is never committed here and never downloaded by hand. mcreference
    # already owns fetching Mojang artifacts and verifying them against Mojang's
    # own manifest, so this asks for the jar and it appears; provenance is
    # published, the artifact stays local, and the run directory is git-ignored.
    #
    # Override any of these: VERSION, WORKSPACE, VANILLA_JAR, MCREFERENCE, JAVA,
    # PREPARE_JAVA, PREPARE_JAVAP, PORT, RUN_DIR, ADMIN, SEED, LEVEL_TYPE,
    # COMPRESSION.
    vars:
      VERSION: '{{.VERSION | default "1.8.9"}}'
      # Where mcreference keeps prepared versions: this repository's own
      # reference/ by default, gitignored, so the vanilla lane never reads a
      # sibling repository's ignored directory. Point WORKSPACE at another
      # checkout that already has the jars to skip the download; the test
      # lanes honour the same choice through MCREFERENCE_WORKSPACE.
      # VERSION takes 1.8.9 and 26.1.2 — the two pinned versions the lane
      # runs — and preparing either is the whole answer to the lane's skip
      # message.
      WORKSPACE: '{{.WORKSPACE | default "."}}'
      VANILLA_JAR: '{{.VANILLA_JAR | default ""}}'
      MCREFERENCE: '{{.MCREFERENCE | default ""}}'
      # The JVM that runs the server, which is the version Minecraft requires:
      # 1.8.x needs Java 8 and will not start on a modern one.
      JAVA: '{{.JAVA | default "java"}}'
      # The JDK mcreference decompiles with, which is a different requirement —
      # 17 or newer, whatever the version being prepared.
      PREPARE_JAVA: '{{.PREPARE_JAVA | default "java"}}'
      PREPARE_JAVAP: '{{.PREPARE_JAVAP | default "javap"}}'
      # Not 25565. The relay capture proxy listens there in front of this
      # server, and a client that reaches the server directly is not the thing
      # under test.
      PORT: '{{.PORT | default "25566"}}'
      RUN_DIR: '{{.RUN_DIR | default ".local/vanilla"}}'
      ADMIN: '{{.ADMIN | default "OCharnyshevich"}}'
      SEED: '{{.SEED | default "orbit1889"}}'
      LEVEL_TYPE: '{{.LEVEL_TYPE | default "FLAT"}}'
      # Vanilla's own default. Leave it on: a capture taken with compression
      # disabled does not exercise the path that broke the relay recorder once.
      COMPRESSION: '{{.COMPRESSION | default "256"}}'
    cmds:
      - |
        set -e

        version='{{.VERSION}}'
        workspace='{{.WORKSPACE}}'
        jar='{{.VANILLA_JAR}}'
        if [ -z "$jar" ]; then
          jar="$workspace/reference/work/versions/$version/server/original.jar"
        fi

        if [ ! -f "$jar" ]; then
          printf 'no server jar for %s; preparing one with mcreference\n' "$version"

          mcreference='{{.MCREFERENCE}}'
          if [ -z "$mcreference" ]; then
            if command -v mcreference >/dev/null 2>&1; then
              mcreference='mcreference'
            elif [ -d ../minecraft-reference ]; then
              # A sibling checkout is the common local case. Released binaries
              # are the supported path; this is the convenience one.
              mcreference='go -C ../minecraft-reference run ./cmd/mcreference'
            else
              printf 'mcreference not found\n' >&2
              printf 'install it with: go install github.com/go-theft-craft/minecraft-reference/cmd/mcreference@latest\n' >&2
              printf 'or set MCREFERENCE, or set VANILLA_JAR to a jar you already have\n' >&2
              exit 1
            fi
          fi

          mkdir -p "$workspace"
          # --sides server only. The client jar is a much larger download and
          # nothing here runs one.
          $mcreference prepare \
            --versions "$version" \
            --sides server \
            --workspace "$workspace" \
            --java '{{.PREPARE_JAVA}}' \
            --javap '{{.PREPARE_JAVAP}}'
        fi

        if [ ! -f "$jar" ]; then
          printf 'still no jar at %s after preparing\n' "$jar" >&2
          exit 1
        fi

        # Print what is about to run. A live check is only evidence if the
        # thing it ran against is identified, and mcreference has already
        # verified this file against Mojang's manifest.
        printf 'jar   %s\n' "$jar"
        printf 'sha1  %s\n' "$(sha1sum "$jar" | cut -d' ' -f1)"

        # Saying this here beats a stack trace from inside the server later.
        case "$version" in
          1.8*|1.7*|1.6*|1.5*|1.4*|1.3*|1.2*|1.1|1.0)
            if ! '{{.JAVA}}' -version 2>&1 | head -1 | grep -q '"1\.8\.'; then
              printf 'minecraft %s needs java 8 to run; JAVA={{.JAVA}} is:\n' "$version" >&2
              '{{.JAVA}}' -version 2>&1 | head -1 >&2
              printf 'set JAVA=<path to a java 8 binary>\n' >&2
              exit 1
            fi
            ;;
        esac

        run='{{.RUN_DIR}}'
        mkdir -p "$run"
        cp -f "$jar" "$run/server.jar"
        printf 'eula=true\n' > "$run/eula.txt"

        cat > "$run/server.properties" <<PROPERTIES
        server-port={{.PORT}}
        online-mode=false
        level-seed={{.SEED}}
        level-type={{.LEVEL_TYPE}}
        gamemode=0
        spawn-protection=0
        max-players=8
        motd=go-theft-craft live check ({{.VERSION}})
        network-compression-threshold={{.COMPRESSION}}
        PROPERTIES

        # Op the admin by writing ops.json, because a scripted run has no
        # console to type into.
        #
        # The UUID is derived, not looked up: an offline server has no account
        # to ask, and it identifies a player as Java's
        # UUID.nameUUIDFromBytes("OfflinePlayer:" + name) — MD5, then the
        # version nibble forced to 3 and the variant bits to RFC 4122. ops.json
        # is keyed on that UUID, so a wrong one produces a file the server reads
        # happily and an admin who is not opped.
        #
        # The variant nibble is mapped by case rather than computed. Task's
        # shell does not parse 0x hex in arithmetic — it evaluates 0x9 to zero
        # and silently yields the wrong digit, which is how this was first got
        # wrong. The mapping is (d & 3) | 8.
        hex="$(printf 'OfflinePlayer:%s' '{{.ADMIN}}' | md5sum | cut -d' ' -f1)"
        case "$(printf '%s' "$hex" | cut -c17)" in
          0|4|8|c) variant=8 ;;
          1|5|9|d) variant=9 ;;
          2|6|a|e) variant=a ;;
          3|7|b|f) variant=b ;;
        esac
        uuid="$(printf '%s-%s-3%s-%s%s-%s' \
          "$(printf '%s' "$hex" | cut -c1-8)"  \
          "$(printf '%s' "$hex" | cut -c9-12)" \
          "$(printf '%s' "$hex" | cut -c14-16)" \
          "$variant" \
          "$(printf '%s' "$hex" | cut -c18-20)" \
          "$(printf '%s' "$hex" | cut -c21-32)")"

        cat > "$run/ops.json" <<OPS
        [{"uuid":"$uuid","name":"{{.ADMIN}}","level":4,"bypassesPlayerLimit":true}]
        OPS

        printf 'vanilla {{.VERSION}} on port {{.PORT}}, op {{.ADMIN}} (%s)\n' "$uuid"
        printf 'run dir %s; stop with ctrl-c or the stop command\n' "$run"

        cd "$run" && exec '{{.JAVA}}' -Xms512M -Xmx1024M -jar server.jar nogui

  vuln:
    desc: Check dependencies for known vulnerabilities
    deps: [deps]
    cmds:
      - env GOWORK=off govulncheck ./...

  build:
    desc: Build every package
    deps: [deps]
    cmds:
      - env GOWORK=off go build ./...

  verify:
    desc: Run all local and CI checks
    cmds:
      - task: lint
      - task: secrets
      - task: test
      - task: test:e2e
      - task: examples
      - task: vuln
      - task: build

  release:check:
    desc: Verify a clean release candidate
    requires:
      vars: [VERSION]
    cmds:
      - task: verify
      - cmd: test -z "$(git status --porcelain)"
        platforms: [linux, darwin]
      - cmd: '! grep -Eq ''^replace[[:space:]]'' go.mod'
        platforms: [linux, darwin]
      - cmd: printf '%s\n' '{{.VERSION}}' | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
        platforms: [linux, darwin]

  default:
    cmds:
      - task --list
