version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errname
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
  exclusions:
    rules:
      # Every event type implements Event with a one-line Name and Domain.
      # What those methods mean is documented once, on the interface; a
      # comment on each of the dozens of implementations would repeat that
      # sentence and say nothing about the event it sits on. The event's own
      # doc comment, which revive still requires, is where the meaning is.
      - path: ^event/
        linters: [revive]
        text: 'exported method \w+\.(Name|Domain|Revision) should have comment'

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/go-theft-craft)
        - prefix(github.com/go-theft-craft/headless-minecraft)
